workflows:
  android-real:
    name: Recover Angola - APK REAL
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      groups:
        - codemagic_credentials
      flutter: stable
      java: 17
      android_signing:
        - keystore_reference
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Check project structure
        script: |
          ls -la
          ls -la android/app/src/main/kotlin/com/recover/angola/ || echo "ERRO: MainActivity.kt não encontrado!"
      - name: Build APK REAL com motor nativo
        script: |
          flutter build apk --release --obfuscate --split-debug-info=./symbols -v
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-release.apk.sha1
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
